<script>
    document.addEventListener("DOMContentLoaded", function() {
        const scrollContainer = document.querySelector('.scroll-container');
        scrollContainer.focus();

        const slides = document.querySelectorAll('.slide');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                } else {
                    entry.target.classList.remove('is-visible');
                }
            });
        }, { threshold: 0.4 });
        
        slides.forEach(slide => observer.observe(slide));

        const rocket = document.getElementById('player-rocket');
        const MAX_SLIDES = 15; // Mamy 16 slajdów (0 do 15)

        let currentProgress = 0;
        let currentVisualAngle = -45; // Rakieta domyślnie patrzy w górę

        // 1. Zwraca IDEALNĄ docelową pozycję rakiety dla danego slajdu
        function getSlideTarget(i) {
            let isMobile = window.innerWidth < 768;
            let baseY = isMobile ? 35 : 50; // Na telefonie planeta jest ciut wyżej (35% ekranu)
            
            // Slajd 0 (Start) i 15 (Meta) - lądowanie na Ziemi
            if (i <= 0) return { x: 50, y: 72, scale: 2.5 };
            if (i >= MAX_SLIDES) return { x: 50, y: 72, scale: 2.5 };

            // Slajdy z planetami (1 do 14) - rakieta leci na przemian lewo/prawo
            let isPlanetLeft = (i + 1) % 2 === 0; 
            let xPos = isPlanetLeft ? 75 : 25; // Odwrotnie do planety
            
            // Lekka korekta odstępów dla telefonów
            if (isMobile) {
                xPos = isPlanetLeft ? 85 : 15;
            }

            return { x: xPos, y: baseY, scale: 1.5 }; // Bezpieczna, stała skala
        }

        // 2. Zwraca płynną pozycję pomiędzy slajdami (interpolacja)
        function getPathPos(progress) {
            let p = Math.max(0, Math.min(MAX_SLIDES, progress));
            let startIndex = Math.floor(p);
            let endIndex = Math.ceil(p);
            let t = p - startIndex;

            // Złagodzenie ruchu (smoothstep) - rakieta miękko zwalnia przy planetach
            let easeT = t * t * (3 - 2 * t);

            let start = getSlideTarget(startIndex);
            let end = getSlideTarget(endIndex);

            return {
                x: start.x + (end.x - start.x) * easeT,
                y: start.y + (end.y - start.y) * easeT,
                scale: start.scale + (end.scale - start.scale) * easeT
            };
        }

        // 3. Główna pętla animacji
        function animationLoop() {
            let scrollTop = scrollContainer.scrollTop;
            let viewportHeight = window.innerHeight;
            let targetProgress = scrollTop / viewportHeight;

            // Rakieta miękko goni scrolla (prędkość 0.08)
            currentProgress += (targetProgress - currentProgress) * 0.08;

            let pos = getPathPos(currentProgress);
            
            // Obliczanie "przyszłej" pozycji, żeby wiedzieć, w którą stronę odwrócić dziób
            let nextPos = getPathPos(currentProgress + 0.05);
            let dx = (nextPos.x - pos.x) * (window.innerWidth / 100);
            let dy = (nextPos.y - pos.y) * (window.innerHeight / 100);
            let speed = Math.sqrt(dx * dx + dy * dy);

            let targetAngle = -45; // Domyślnie rakieta ustawia się pionowo do góry na postojach
            
            // Jeśli rakieta wyraźnie się przemieszcza, obracamy ją w kierunku lotu
            if (speed > 1) {
                let mathAngle = Math.atan2(dy, dx) * 180 / Math.PI;
                targetAngle = mathAngle + 45; // Dodajemy 45, bo to emoji 🚀 domyślnie "leży" pod kątem
            }

            // Zapobieganie wariowaniu przy obrocie (wybiera najkrótszą drogę przez kąty)
            let angleDiff = targetAngle - currentVisualAngle;
            angleDiff = ((angleDiff + 180) % 360 + 360) % 360 - 180;
            currentVisualAngle += angleDiff * 0.1;

            // Aplikowanie stylów
            rocket.style.left = `${pos.x}%`;
            rocket.style.top = `${pos.y}%`;
            rocket.style.transform = `translate(-50%, -50%) rotate(${currentVisualAngle}deg) scale(${pos.scale})`;

            requestAnimationFrame(animationLoop);
        }

        requestAnimationFrame(animationLoop);
    });
</script>
