<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalekie Obiekty - Kosmiczny Świat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/deepsky.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <nav class="navbar">
    <div class="container">
      <div class="navbar-brand">🌌 Kosmiczny Świat</div>
      <ul class="navbar-links">
        <li><a href="index.html">🏠 Strona Główna</a></li>
        <li><a href="uklad-sloneczny.html">🪐 Układ Słoneczny</a></li>
        <li><a href="ksiezyce.html">🌙 Księżyce</a></li>
        <li><a href="dalekie-obiekty.html" class="active">🌌 Dalekie Obiekty</a></li>
      </ul>
    </div>
  </nav>

  <main class="deepsky-page">
    <div class="deepsky-container">
      <h1 class="section-title">🌌 Dalekie Obiekty</h1>
      <p class="section-subtitle">Podróżuj po najdalszych zakątkach Wszechświata!</p>

      <div class="filter-bar" id="filterBar"></div>

      <h2 class="section-title mt-3">Wybierz typ obiektu:</h2>
      <div class="card-grid" id="deepskyGrid"></div>
      <div id="constellationsContainer" style="margin-top: 2rem;"></div>
    </div>
  </main>

  <!-- Modal dla dalekich obiektów -->
  <div class="modal-overlay" id="deepskyModal">
    <div class="modal">
      <button class="modal-close">✕</button>
      <div class="modal-visual"></div>
      <h2 class="modal-title"></h2>
      <p class="modal-desc"></p>
      <div class="modal-stats">
        <div class="modal-stat"><div class="modal-stat-value" data-stat="temp"></div><div class="modal-stat-label">Temperatura</div></div>
        <div class="modal-stat"><div class="modal-stat-value" data-stat="distance"></div><div class="modal-stat-label">Odległość</div></div>
      </div>
      <div class="modal-funfact">
        <div class="modal-funfact-title">🌟 Ciekawostka!</div>
        <div class="modal-funfact-text"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-icons">✨ 🌟 🌌 ✨</div>
    <p>Kosmiczny Świat – strona edukacyjna dla dzieci.</p>
  </footer>

  <script src="js/stars.js"></script>
  <script src="js/deepsky.js"></script>
</body>
</html>
